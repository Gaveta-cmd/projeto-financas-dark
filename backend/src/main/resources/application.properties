spring.application.name=vibefinance-api
server.port=${API_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vibefinance}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:vibefinance}
spring.datasource.password=${DB_PASSWORD:vibefinance}

spring.flyway.locations=classpath:db/migration

# Sessão de login (dias) e cadastro de novos usuários (desligue depois que a família se cadastrar)
app.session.days=${SESSION_DAYS:30}
app.signup.enabled=${SIGNUP_ENABLED:true}
